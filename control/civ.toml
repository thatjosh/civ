# Launch-time shape of the civilisation. Read by the orchestrator at start, restore and reshape;
# keys marked knob are seeded into the config table, where supervisors tune them from there.
# Operator-owned: no agent writes this file, and `civ reshape` is how a change takes effect.
[population]
solvers = 3
supervisors = 1

[cadence]
supervisor_round_s = 600

[lifecycle]
max_generations = 5
handoff_pct = 80          # knob
kill_pct = 90             # knob
kill_grace_turns = 2      # knob

[voting]
decay_offset_h = 2        # knob
decay_power = 1.5         # knob
operator_pin_s = 300

[governance]
vote_quota = 1            # knob
min_sample = 3            # knob; the design says 10 for a 95-solver run, 3 fits an eight-task pack
big_move_steps = 2        # knob
ttl_default_s = 3600

[merge]
# The merge gate (M6). A proposal that touches a protected path waits for `civ merge --approve`;
# anything outside harness/ is refused outright. The orchestrator's merger runs test_command in an
# isolated worktree and merges only on green.
max_per_round = 2
protected_paths = [
  "harness/orchestrator/spawner.py", "harness/orchestrator/governor.py", "harness/orchestrator/merger.py",
  "harness/board_mcp/ceilings.py", "harness/board_mcp/auth.py", "harness/board_mcp/tools/task.py",
  "harness/board_mcp/merge_rules.py", "control/", "task/", "scripts/",
]
test_command = "python -m pytest harness/tests -q -x -p no:cacheprovider"
